<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Design and Supply</title>
<meta name="description" content="Custom 3D design services, 3D-printed products and printing supplies.">
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1c1c1e; --muted: #6b6b70;
    --border: #e3e1dc; --accent: #ff6a2b; --accent-text: #ffffff; --stage: #ecebe7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121214; --surface: #1c1c20; --text: #f2f2f4; --muted: #9c9ca4;
      --border: #2c2c32; --accent: #ff7a3f; --accent-text: #121214; --stage: #24242a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; }
  button { font: inherit; cursor: pointer; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .cart-btn { background: var(--text); color: var(--bg); border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 600; }

  .hero { padding: 56px 0 32px; }
  .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.1; margin: 0 0 12px; letter-spacing: -0.03em; }
  .hero p { color: var(--muted); max-width: 560px; margin: 0; font-size: 1.1rem; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 14px; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; padding-bottom: 64px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column; transition: transform .15s; }
  .card:hover { transform: translateY(-3px); }
  .card .stage { aspect-ratio: 1; background: var(--stage); cursor: pointer; }
  .card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card .cat { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .card h3 { margin: 0; font-size: 1.05rem; }
  .card .row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; }
  .price { font-weight: 700; }
  .add { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 600; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 20; }
  .overlay.open { display: block; }
  .modal { position: fixed; inset: 0; display: none; place-items: center; z-index: 30; padding: 16px; }
  .modal.open { display: grid; }
  .modal .box { background: var(--surface); border-radius: 20px; max-width: 880px; width: 100%; max-height: 92vh; overflow: auto;
    display: grid; grid-template-columns: 1fr 1fr; }
  .modal .stage { background: var(--stage); min-height: 320px; }
  .modal .info { padding: 28px; display: flex; flex-direction: column; gap: 12px; }
  .modal h2 { margin: 0; }
  .modal p { margin: 0; color: var(--muted); }
  .hint { font-size: .8rem; color: var(--muted); }
  .close { align-self: flex-end; background: none; border: 0; font-size: 1.5rem; color: var(--muted); line-height: 1; }
  @media (max-width: 700px) { .modal .box { grid-template-columns: 1fr; } }

  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(400px, 100%); background: var(--surface);
    z-index: 30; transform: translateX(100%); transition: transform .25s; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer .head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .drawer .items { flex: 1; overflow: auto; padding: 8px 20px; }
  .line { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .drawer .foot { padding: 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
  .total { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.1rem; }
  .checkout { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 12px; padding: 14px; font-weight: 700; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }

  footer { border-top: 1px solid var(--border); padding: 24px 0; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo">3D Design <span>&amp;</span> Supply</div>
    <button class="cart-btn" id="openCart">Cart (<span id="cartCount">0</span>)</button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Designed in 3D.<br>Made for you.</h1>
    <p>Custom 3D design, printed products and the supplies to make your own. Tap any product to spin it around in 3D.</p>
  </section>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">© <span id="year"></span> 3D Design and Supply</div></footer>

<div class="overlay" id="overlay"></div>

<div class="modal" id="modal">
  <div class="box">
    <div class="stage" id="modalStage"></div>
    <div class="info">
      <button class="close" data-close aria-label="Close">×</button>
      <span class="cat" id="mCat"></span>
      <h2 id="mName"></h2>
      <div class="price" id="mPrice"></div>
      <p id="mDesc"></p>
      <span class="hint">Drag to rotate · scroll to zoom</span>
      <button class="add" id="mAdd">Add to cart</button>
    </div>
  </div>
</div>

<aside class="drawer" id="drawer" aria-label="Cart">
  <div class="head"><strong>Your cart</strong><button class="close" data-close aria-label="Close">×</button></div>
  <div class="items" id="items"></div>
  <div class="foot">
    <div class="total"><span>Total</span><span id="total">$0.00</span></div>
    <button class="checkout" id="checkout">Checkout</button>
  </div>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// ---------------------------------------------------------------
// EDIT YOUR PRODUCTS HERE.
// shape:     preview shape used until you have a real 3D file
// model:     optional path to a .glb file (e.g. "models/vase.glb")
// squareUrl: optional Square payment link for this product
// ---------------------------------------------------------------
const PRODUCTS = [
  { id: "custom-design", name: "Custom 3D Design", category: "Design Services", price: 149,
    desc: "Send us your idea, sketch or photo and we'll turn it into a print-ready 3D model. Includes two rounds of revisions.",
    shape: "knot", color: "#ff6a2b" },
  { id: "prototype", name: "Rapid Prototype Print", category: "Design Services", price: 89,
    desc: "Have a model already? We'll print a high-detail prototype and ship it within 5 business days.",
    shape: "gear", color: "#4b7bec" },
  { id: "planter", name: "Geo Planter", category: "Printed Products", price: 34,
    desc: "Faceted low-poly planter with drainage tray. Printed in matte PLA, 12 cm tall.",
    shape: "planter", color: "#20bf6b" },
  { id: "vase", name: "Spiral Vase", category: "Printed Products", price: 42,
    desc: "Twisted vase printed in a single continuous layer. Waterproof liner included.",
    shape: "vase", color: "#a55eea" },
  { id: "figurine", name: "Desk Figurine", category: "Printed Products", price: 24,
    desc: "Smooth abstract desk sculpture. Choose your color at checkout.",
    shape: "ico", color: "#f7b731" },
  { id: "pla", name: "PLA Filament 1 kg", category: "Supplies", price: 22,
    desc: "1.75 mm PLA, ±0.02 mm tolerance, vacuum sealed. Prints at 190–220 °C.",
    shape: "spool", color: "#eb3b5a" },
  { id: "petg", name: "PETG Filament 1 kg", category: "Supplies", price: 26,
    desc: "Tough, food-safe PETG for functional parts. 1.75 mm, prints at 230–250 °C.",
    shape: "spool", color: "#0fb9b1" },
  { id: "nozzles", name: "Nozzle Kit (10 pc)", category: "Supplies", price: 15,
    desc: "Brass nozzles from 0.2 to 1.0 mm. Fits most MK8-style hot ends.",
    shape: "nozzle", color: "#d4a017" },
];

const CHECKOUT = {
  // PayPal: put the email of your PayPal Business account here and the whole
  // cart is sent to PayPal checkout (customers can pay by card or PayPal).
  paypalEmail: "",
  currency: "USD",
  // Square: give a product a squareUrl (a Square payment link) and a cart
  // holding only that product goes to Square checkout.
  // With neither set up, orders are emailed to you instead.
  email: "orders@example.com",
};

// ---------- 3D shapes ----------
function makeShape(kind, color) {
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.1, flatShading: kind === "planter" });
  let geo;
  switch (kind) {
    case "knot": geo = new THREE.TorusKnotGeometry(0.7, 0.24, 180, 24); break;
    case "ico": geo = new THREE.IcosahedronGeometry(1, 1); break;
    case "planter": geo = new THREE.CylinderGeometry(1, 0.7, 1.4, 7, 1); break;
    case "vase": {
      const pts = [];
      for (let i = 0; i <= 20; i++) { const t = i / 20; pts.push(new THREE.Vector2(0.45 + 0.35 * Math.sin(t * Math.PI * 1.4), t * 2 - 1)); }
      geo = new THREE.LatheGeometry(pts, 48);
      mat.side = THREE.DoubleSide;
      break;
    }
    case "spool": {
      const g = new THREE.Group();
      const flange = new THREE.CylinderGeometry(1.1, 1.1, 0.08, 48);
      const a = new THREE.Mesh(flange, new THREE.MeshStandardMaterial({ color: "#2d2d33", roughness: 0.6 }));
      const b = a.clone(); a.position.y = 0.5; b.position.y = -0.5;
      const core = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.92, 48), mat);
      g.add(a, b, core); g.rotation.x = 0.5; return g;
    }
    case "gear": {
      const s = new THREE.Shape(); const teeth = 12;
      for (let i = 0; i < teeth * 2; i++) {
        const r = i % 2 ? 0.8 : 1.05, a = (i / (teeth * 2)) * Math.PI * 2;
        i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      const hole = new THREE.Path(); hole.absarc(0, 0, 0.3, 0, Math.PI * 2, true); s.holes.push(hole);
      geo = new THREE.ExtrudeGeometry(s, { depth: 0.35, bevelEnabled: true, bevelSize: 0.04, bevelThickness: 0.04 });
      geo.center(); break;
    }
    case "nozzle": {
      const g = new THREE.Group();
      const hex = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.5, 6), mat);
      const thread = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.8, 32), mat);
      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.6, 32), mat);
      thread.position.y = 0.65; tip.position.y = -0.55; tip.rotation.x = Math.PI;
      g.add(hex, thread, tip); return g;
    }
    default: geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
  }
  return new THREE.Mesh(geo, mat);
}

const gltf = new GLTFLoader();
function createViewer(el, product, { interactive }) {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  el.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0.6, 6.2);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.6));
  const key = new THREE.DirectionalLight(0xffffff, 2); key.position.set(3, 4, 5); scene.add(key);

  const holder = new THREE.Group(); scene.add(holder);
  holder.add(makeShape(product.shape, product.color));
  if (product.model) {
    gltf.load(product.model, (res) => {
      const obj = res.scene; const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3()).length();
      obj.scale.setScalar(2.4 / size); obj.position.sub(box.getCenter(new THREE.Vector3()).multiplyScalar(2.4 / size));
      holder.clear(); holder.add(obj);
    });
  }

  let controls = null;
  if (interactive) {
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 3; controls.maxDistance = 9;
    controls.autoRotate = true; controls.autoRotateSpeed = 1.5;
  }

  let hovering = false;
  el.addEventListener("pointerenter", () => hovering = true);
  el.addEventListener("pointerleave", () => hovering = false);

  function resize() {
    const { width, height } = el.getBoundingClientRect();
    if (!width || !height) return;
    renderer.setSize(width, height, false);
    renderer.domElement.style.width = "100%"; renderer.domElement.style.height = "100%";
    camera.aspect = width / height; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(el); resize();

  let visible = true;
  new IntersectionObserver(([e]) => visible = e.isIntersecting).observe(el);

  let running = true;
  (function loop() {
    if (!running) return;
    requestAnimationFrame(loop);
    if (!visible) return;
    if (controls) controls.update(); else holder.rotation.y += hovering ? 0.03 : 0.006;
    renderer.render(scene, camera);
  })();
  return { dispose() { running = false; controls?.dispose(); renderer.dispose(); el.innerHTML = ""; } };
}

// ---------- UI ----------
const $ = (id) => document.getElementById(id);
const money = (n) => "$" + n.toFixed(2);
const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
$("year").textContent = new Date().getFullYear();

const categories = ["All", ...new Set(PRODUCTS.map(p => p.category))];
let active = "All";
function renderFilters() {
  $("filters").innerHTML = "";
  for (const c of categories) {
    const b = document.createElement("button");
    b.className = "chip" + (c === active ? " active" : ""); b.textContent = c;
    b.onclick = () => { active = c; renderFilters(); renderGrid(); };
    $("filters").appendChild(b);
  }
}

let viewers = [];
function renderGrid() {
  viewers.forEach(v => v.dispose()); viewers = [];
  $("grid").innerHTML = "";
  for (const p of PRODUCTS.filter(p => active === "All" || p.category === active)) {
    const card = document.createElement("article"); card.className = "card";
    card.innerHTML = `<div class="stage" title="View details"></div>
      <div class="body"><span class="cat">${p.category}</span><h3>${p.name}</h3>
      <div class="row"><span class="price">${money(p.price)}</span><button class="add">Add</button></div></div>`;
    $("grid").appendChild(card);
    const stage = card.querySelector(".stage");
    viewers.push(createViewer(stage, p, { interactive: false }));
    stage.onclick = () => openProduct(p.id);
    card.querySelector(".add").onclick = () => addToCart(p.id);
  }
}

let modalViewer = null;
function openProduct(id) {
  const p = byId[id];
  $("mCat").textContent = p.category; $("mName").textContent = p.name;
  $("mPrice").textContent = money(p.price); $("mDesc").textContent = p.desc;
  $("mAdd").onclick = () => { addToCart(p.id); closeAll(); openCart(); };
  $("modal").classList.add("open"); $("overlay").classList.add("open");
  modalViewer = createViewer($("modalStage"), p, { interactive: true });
}

// cart
let cart = {};
try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch {}
function save() { try { localStorage.setItem("cart", JSON.stringify(cart)); } catch {} renderCart(); }
function addToCart(id) { cart[id] = (cart[id] || 0) + 1; save(); }
function setQty(id, q) { if (q <= 0) delete cart[id]; else cart[id] = q; save(); }
function renderCart() {
  const ids = Object.keys(cart).filter(id => byId[id]);
  $("cartCount").textContent = ids.reduce((s, id) => s + cart[id], 0);
  const total = ids.reduce((s, id) => s + byId[id].price * cart[id], 0);
  $("total").textContent = money(total);
  $("items").innerHTML = ids.length ? "" : `<div class="empty">Your cart is empty.</div>`;
  for (const id of ids) {
    const p = byId[id], row = document.createElement("div"); row.className = "line";
    row.innerHTML = `<div><strong>${p.name}</strong><div class="hint">${money(p.price)} each</div></div>
      <div class="qty"><button aria-label="Less">−</button><span>${cart[id]}</span><button aria-label="More">+</button></div>`;
    const [minus, plus] = row.querySelectorAll("button");
    minus.onclick = () => setQty(id, cart[id] - 1); plus.onclick = () => setQty(id, cart[id] + 1);
    $("items").appendChild(row);
  }
  $("checkout").disabled = !ids.length;
}

function paypalCheckout(ids) {
  const form = document.createElement("form");
  form.method = "POST"; form.action = "https://www.paypal.com/cgi-bin/webscr";
  const fields = { cmd: "_cart", upload: "1", business: CHECKOUT.paypalEmail,
    currency_code: CHECKOUT.currency, return: location.href.split("#")[0] + "#thanks" };
  ids.forEach((id, i) => {
    fields[`item_name_${i + 1}`] = byId[id].name;
    fields[`amount_${i + 1}`] = byId[id].price.toFixed(2);
    fields[`quantity_${i + 1}`] = cart[id];
  });
  for (const [k, v] of Object.entries(fields)) {
    const input = document.createElement("input"); input.type = "hidden"; input.name = k; input.value = v; form.appendChild(input);
  }
  document.body.appendChild(form); form.submit();
}

$("checkout").onclick = () => {
  const ids = Object.keys(cart).filter(id => byId[id]);
  if (CHECKOUT.paypalEmail) return paypalCheckout(ids);
  if (ids.length === 1 && cart[ids[0]] === 1 && byId[ids[0]].squareUrl) return location.href = byId[ids[0]].squareUrl;
  const lines = ids.map(id => `${cart[id]} × ${byId[id].name} — ${money(byId[id].price * cart[id])}`);
  const body = `Hi! I'd like to order:\n\n${lines.join("\n")}\n\nTotal: ${$("total").textContent}\n\nName:\nShipping address:\n`;
  location.href = `mailto:${CHECKOUT.email}?subject=${encodeURIComponent("New order")}&body=${encodeURIComponent(body)}`;
};

function openCart() { $("drawer").classList.add("open"); $("overlay").classList.add("open"); }
function closeAll() {
  $("drawer").classList.remove("open"); $("modal").classList.remove("open"); $("overlay").classList.remove("open");
  modalViewer?.dispose(); modalViewer = null;
}
$("openCart").onclick = openCart;
$("overlay").onclick = closeAll;
$("modal").onclick = (e) => { if (e.target.id === "modal") closeAll(); };
document.querySelectorAll("[data-close]").forEach(b => b.onclick = closeAll);
addEventListener("keydown", (e) => e.key === "Escape" && closeAll());

if (location.hash === "#thanks") { cart = {}; save(); history.replaceState(null, "", location.pathname); alert("Thank you for your order! We'll be in touch soon."); }
renderFilters(); renderGrid(); renderCart();
</script>
</body>
</html>
